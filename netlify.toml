[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Expo Router / SPA routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static Expo assets
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
